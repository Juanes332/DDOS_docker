name: ddos-lab

# Laboratorio de ataque.
# - "lab" es una red con salida a Internet: los contenedores alcanzan cualquier
#   destino.
# - La victima se publica en el puerto 8000 de todas las interfaces (accesible
#   desde fuera).

services:
  target:
    build: ./target
    container_name: ddoslab-target
    environment:
      MAX_INFLIGHT: "16"   # peticiones simultaneas que atiende
      WORK_MS: "100"       # coste de cada peticion
      BACKLOG: "128"       # cola de aceptacion TCP
    ports:
      - "8000:8000"
    networks: [lab, ui]
    restart: unless-stopped

  loadgen:
    build: ./loadgen
    container_name: ddoslab-loadgen
    profiles: ["attack"]
    networks: [lab]
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M
    command: ["--help"]

networks:
  lab:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
  ui:
    driver: bridge
