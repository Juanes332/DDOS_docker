# Overlay opcional (legacy). Con la red "lab" con salida a Internet este fichero
# ya no es necesario; se mantiene por compatibilidad.
#
#   scripts/attack.sh --dns mi-servidor.local --port 80 --lan ...
#
# Anade al contenedor atacante una red bridge extra llamada "lan".
services:
  loadgen:
    networks:
      - lab
      - lan

networks:
  lan:
    driver: bridge
